<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | PhysioTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2878f0;
            --secondary: #1246a8;
            --accent: #69c5ff;
            --error: #ef233c;
            --success: #16a6c9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            background:
                radial-gradient(circle at 15% 15%, rgba(77, 164, 255, .20), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(24, 91, 205, .16), transparent 34%),
                linear-gradient(135deg, #f8fbff 0%, #e8f1ff 52%, #dce9ff 100%);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
            animation: float 8s ease-in-out infinite;
        }

        .orb-one {
            width: 190px;
            height: 190px;
            top: 7%;
            left: 8%;
            background: linear-gradient(135deg, rgba(73, 157, 255, .24), rgba(20, 75, 190, .06));
            box-shadow: inset -12px -12px 28px rgba(27, 83, 180, .10), 0 25px 60px rgba(40, 120, 240, .10);
        }

        .orb-two {
            width: 130px;
            height: 130px;
            right: 10%;
            bottom: 9%;
            background: linear-gradient(135deg, rgba(255, 255, 255, .9), rgba(79, 157, 255, .20));
            box-shadow: inset -10px -10px 24px rgba(40, 120, 240, .10), 0 20px 50px rgba(40, 120, 240, .12);
            animation-delay: -3s;
        }

        .orb-three {
            width: 65px;
            height: 65px;
            right: 19%;
            top: 16%;
            background: linear-gradient(135deg, #fff, #b8d8ff);
            box-shadow: 0 15px 35px rgba(40, 120, 240, .16);
            animation-delay: -5s;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 430px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .9);
            border-radius: 25px;
            background: rgba(255, 255, 255, .78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 28px 75px rgba(29, 76, 145, .18), 0 7px 20px rgba(37, 111, 218, .08);
            animation: cardEnter .75s cubic-bezier(.2, .8, .2, 1) both;
            transform-style: preserve-3d;
            transition: box-shadow .3s ease;
        }

        .card:hover {
            box-shadow: 0 34px 85px rgba(29, 76, 145, .23), 0 10px 25px rgba(37, 111, 218, .10);
        }

        .card-header {
            position: relative;
            overflow: hidden;
            padding: 36px 30px 32px;
            text-align: center;
            color: #fff;
            background: linear-gradient(135deg, #3188ff 0%, #2465d8 52%, #143f9d 100%);
        }

        .card-header::before,
        .card-header::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .09);
            pointer-events: none;
        }

        .card-header::before {
            width: 190px;
            height: 190px;
            top: -105px;
            right: -45px;
        }

        .card-header::after {
            width: 120px;
            height: 120px;
            bottom: -78px;
            left: -22px;
        }

        .icon-circle {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 16px;
            border: 1px solid rgba(255, 255, 255, .48);
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .09));
            box-shadow: inset 2px 2px 8px rgba(255, 255, 255, .20), 0 12px 24px rgba(8, 34, 99, .22);
            transform: translateZ(25px) rotate(-5deg);
        }

        .icon-circle i {
            font-size: 2rem;
        }

        .card-header h2 {
            position: relative;
            z-index: 1;
            font-size: 1.55rem;
            font-weight: 600;
            letter-spacing: -.3px;
        }

        .card-header p {
            position: relative;
            z-index: 1;
            margin-top: 7px;
            font-size: .86rem;
            font-weight: 300;
            opacity: .9;
            line-height: 1.6;
        }

        .card-body {
            padding: 32px 30px 30px;
        }

        .alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 13px 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            font-size: .85rem;
            line-height: 1.5;
        }

        .alert i {
            margin-top: 3px;
        }

        .alert-success {
            color: #08758e;
            background: rgba(22, 166, 201, .10);
            border: 1px solid rgba(22, 166, 201, .18);
            border-left: 4px solid var(--success);
        }

        .alert-error {
            color: #d71935;
            background: rgba(239, 35, 60, .07);
            border: 1px solid rgba(239, 35, 60, .15);
            border-left: 4px solid var(--error);
        }

        .alert-warning {
            color: #a95c00;
            background: rgba(248, 150, 30, .10);
            border: 1px solid rgba(248, 150, 30, .18);
            border-left: 4px solid #f8961e;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #284365;
            font-size: .78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap>i {
            position: absolute;
            top: 50%;
            left: 16px;
            z-index: 1;
            color: #8da4c1;
            font-size: 1rem;
            transform: translateY(-50%);
            transition: color .25s ease;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            padding: 15px 15px 15px 46px;
            border: 1.5px solid #dce7f5;
            border-radius: 13px;
            outline: none;
            background: rgba(247, 250, 255, .9);
            color: #183455;
            font-family: 'Poppins', sans-serif;
            font-size: .9rem;
            transition: border-color .25s ease, box-shadow .25s ease, background .25s ease, transform .25s ease;
        }

        .form-control::placeholder {
            color: #9aacc3;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(40, 120, 240, .12);
            transform: translateY(-1px);
        }

        .input-wrap:focus-within>i {
            color: var(--primary);
        }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 18px;
            border: 0;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(110deg, #3188ff 0%, #2465d8 55%, #1749ad 100%);
            box-shadow: 0 10px 22px rgba(36, 101, 216, .25);
            font-family: 'Poppins', sans-serif;
            font-size: .94rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 28px rgba(36, 101, 216, .32);
            filter: saturate(1.1);
        }

        .btn-submit:active {
            transform: translateY(-1px) scale(.99);
        }

        .footer-link {
            margin-top: 25px;
            text-align: center;
            color: #71839a;
            font-size: .85rem;
        }

        .footer-link a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #2368d7;
            font-weight: 600;
            text-decoration: none;
            transition: gap .2s ease, color .2s ease;
        }

        .footer-link a:hover {
            gap: 12px;
            color: #1246a8;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(0, -18px, 0);
            }
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: perspective(1000px) translateY(28px) rotateX(7deg) scale(.97);
            }

            to {
                opacity: 1;
                transform: perspective(1000px) translateY(0) rotateX(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                border-radius: 21px;
            }

            .card-header {
                padding: 31px 22px 28px;
            }

            .card-body {
                padding: 27px 22px 25px;
            }

            .orb-one {
                width: 130px;
                height: 130px;
                top: 4%;
                left: -30px;
            }

            .orb-two {
                width: 95px;
                height: 95px;
                right: -25px;
                bottom: 6%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>

    <main class="card" id="resetCard">
        <header class="card-header">
            <div class="icon-circle"><i class="fas fa-key" aria-hidden="true"></i></div>
            <h2>Forgot Password?</h2>
            <p>Enter your email and we'll send a reset link</p>
        </header>

        <section class="card-body">
            {% if message %}
            <div class="alert {% if 'not available' in message %}alert-warning{% else %}alert-success{% endif %}"
                role="status">
                <i class="fas {% if 'not available' in message %}fa-exclamation-triangle{% else %}fa-check-circle{% endif %}"
                    aria-hidden="true"></i>
                <span>{{ message }}</span>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-error" role="alert">
                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="Enter your registered email" autocomplete="email" required>
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane" aria-hidden="true"></i>
                    <span>Send Reset Link</span>
                </button>
            </form>

            <div class="footer-link">
                <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Login</a>
            </div>
        </section>
    </main>

    <script>
        // Subtle 3D tilt on desktop; disabled for touch and reduced-motion users.
        (() => {
            const card = document.getElementById('resetCard');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

            if (!card || reduceMotion || !finePointer) return;

            card.addEventListener('pointermove', (event) => {
                const rect = card.getBoundingClientRect();
                const x = (event.clientX - rect.left) / rect.width;
                const y = (event.clientY - rect.top) / rect.height;
                const rotateY = (x - 0.5) * 3;
                const rotateX = (0.5 - y) * 3;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            card.addEventListener('pointerleave', () => {
                card.style.transform = '';
            });
        })();
    </script>
</body>

</html>
