<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Exercise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --blue-900: #0a2a66;
            --blue-700: #1556c0;
            --blue-500: #2f80ed;
            --blue-300: #7fb5ff;
            --blue-100: #e6f1ff;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: var(--blue-900);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #eaf3ff, #ffffff, #d6e8ff, #ffffff);
            background-size: 400% 400%;
            animation: bgShift 16s ease infinite;
            overflow-x: hidden;
            perspective: 1200px;
        }

        @keyframes bgShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ---------- Floating 3D shapes ---------- */
        .scene {
            position: fixed;
            inset: 0;
            pointer-events: none;
            transform-style: preserve-3d;
            z-index: 0;
        }

        .cube {
            position: absolute;
            width: 70px;
            height: 70px;
            transform-style: preserve-3d;
            animation: spin 18s linear infinite, bob 6s ease-in-out infinite;
            opacity: .85;
        }

        .cube span {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(47, 128, 237, .5);
            background: linear-gradient(135deg, rgba(127, 181, 255, .35), rgba(255, 255, 255, .55));
            backdrop-filter: blur(2px);
        }

        .cube span:nth-child(1) {
            transform: translateZ(35px);
        }

        .cube span:nth-child(2) {
            transform: rotateY(180deg) translateZ(35px);
        }

        .cube span:nth-child(3) {
            transform: rotateY(90deg) translateZ(35px);
        }

        .cube span:nth-child(4) {
            transform: rotateY(-90deg) translateZ(35px);
        }

        .cube span:nth-child(5) {
            transform: rotateX(90deg) translateZ(35px);
        }

        .cube span:nth-child(6) {
            transform: rotateX(-90deg) translateZ(35px);
        }

        .cube.c1 {
            top: 10%;
            left: 8%;
            animation-duration: 20s, 7s;
        }

        .cube.c2 {
            top: 68%;
            left: 14%;
            width: 46px;
            height: 46px;
            animation-duration: 14s, 5s;
        }

        .cube.c2 span {
            transform-origin: center;
        }

        .cube.c3 {
            top: 16%;
            right: 10%;
            width: 56px;
            height: 56px;
            animation-duration: 24s, 8s;
        }

        .cube.c4 {
            top: 72%;
            right: 8%;
            animation-duration: 17s, 6s;
        }

        @keyframes spin {
            from {
                transform: rotateX(0deg) rotateY(0deg);
            }

            to {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        @keyframes bob {

            0%,
            100% {
                margin-top: 0;
            }

            50% {
                margin-top: -28px;
            }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            animation: float 10s ease-in-out infinite;
        }

        .orb.o1 {
            width: 320px;
            height: 320px;
            background: rgba(47, 128, 237, .28);
            top: -80px;
            left: -80px;
        }

        .orb.o2 {
            width: 380px;
            height: 380px;
            background: rgba(127, 181, 255, .35);
            bottom: -120px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(30px) scale(1.08);
            }
        }

        /* ---------- 3D glass card ---------- */
        .card-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            transform-style: preserve-3d;
            animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(40px) rotateX(18deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        .card {
            position: relative;
            padding: 36px 34px 30px;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(255, 255, 255, .92), rgba(230, 241, 255, .75));
            border: 1px solid rgba(255, 255, 255, .9);
            backdrop-filter: blur(14px);
            box-shadow:
                0 1px 0 #fff inset,
                0 30px 60px -15px rgba(21, 86, 192, .35),
                0 12px 24px -8px rgba(21, 86, 192, .2);
            transform-style: preserve-3d;
            transition: transform .15s ease-out, box-shadow .3s;
            will-change: transform;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .7), transparent 55%);
            pointer-events: none;
        }

        .card h2 {
            margin: 0 0 6px;
            font-size: 2rem;
            letter-spacing: .3px;
            background: linear-gradient(90deg, var(--blue-900), var(--blue-500));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transform: translateZ(50px);
        }

        .subtitle {
            margin: 0 0 24px;
            color: #5b78a8;
            font-size: .95rem;
            transform: translateZ(30px);
        }

        .error {
            background: #fff0f0;
            color: #c0352b;
            border: 1px solid #ffc9c4;
            border-left: 5px solid #e5483b;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: .92rem;
            animation: shake .45s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        form {
            background: none;
            padding: 0;
            transform-style: preserve-3d;
        }

        .form-group {
            margin-bottom: 20px;
            transform: translateZ(35px);
            opacity: 0;
            animation: fadeUp .6s ease forwards;
        }

        .form-group:nth-of-type(1) {
            animation-delay: .25s;
        }

        .form-group:nth-of-type(2) {
            animation-delay: .4s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px) translateZ(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0) translateZ(35px);
            }
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: .9rem;
            color: var(--blue-700);
        }

        select,
        input {
            width: 100%;
            padding: 13px 15px;
            font-size: 1rem;
            color: var(--blue-900);
            background: var(--white);
            border: 2px solid #d3e4ff;
            border-radius: 12px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(21, 86, 192, .08), 0 4px 10px -4px rgba(21, 86, 192, .15);
            transition: border-color .25s, box-shadow .25s, transform .25s;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            padding-right: 44px;
            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%232f80ed' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
        }

        select:focus,
        input:focus {
            border-color: var(--blue-500);
            box-shadow: 0 0 0 4px rgba(47, 128, 237, .18), 0 10px 20px -8px rgba(47, 128, 237, .4);
            transform: translateY(-2px);
        }

        /* ---------- 3D buttons ---------- */
        button {
            position: relative;
            width: 100%;
            padding: 14px 18px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: .5px;
            color: var(--white);
            background: linear-gradient(180deg, #4b98ff, var(--blue-700));
            border: none;
            border-radius: 14px;
            cursor: pointer;
            overflow: hidden;
            transform: translateZ(45px);
            box-shadow:
                0 6px 0 #0e3f8f,
                0 14px 24px -6px rgba(21, 86, 192, .55);
            transition: transform .12s, box-shadow .12s, filter .2s;
        }

        button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 60%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .55), transparent);
            transform: skewX(-20deg);
            transition: left .6s;
        }

        button:hover {
            filter: brightness(1.08);
            transform: translateZ(45px) translateY(-2px);
        }

        button:hover::after {
            left: 140%;
        }

        button:active {
            transform: translateZ(45px) translateY(5px);
            box-shadow: 0 1px 0 #0e3f8f, 0 6px 12px -4px rgba(21, 86, 192, .5);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            color: var(--blue-700);
            font-weight: 600;
            text-decoration: none;
            transform: translateZ(25px);
            transition: gap .25s, color .25s;
        }

        .back-link:hover {
            gap: 12px;
            color: var(--blue-500);
        }

        @media (max-width: 520px) {
            .card {
                padding: 28px 22px 24px;
            }

            .cube {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .form-group {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- decorative 3D background -->
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="scene" aria-hidden="true">
        {% for n in range(1, 5) %}
        <div class="cube c{{ n }}">
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        {% endfor %}
    </div>

    <div class="card-wrap">
        <div class="card" id="tiltCard">
            <h2>Select Exercise</h2>
            <p class="subtitle">Pick a workout and set your target.</p>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('select_exercise') }}">
                <div class="form-group">
                    <label for="exercise">Exercise</label>
                    <select id="exercise" name="exercise" required>
                        {% for ex in exercises %}
                        <option value="{{ ex.name|lower|replace(' ', '_') }}">
                            {{ ex.name }}: {{ ex.description }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="target">Target Count</label>
                    <input type="number" id="target" name="target" min="1" placeholder="e.g. 20" required>
                </div>

                <button type="submit">Start Exercise</button>
            </form>

            <a class="back-link" href="{{ url_for('profile') }}">&larr; Back to Profile</a>
        </div>
    </div>

    <script>
        // Mouse-driven 3D tilt + moving highlight
        (function () {
            const card = document.getElementById('tiltCard');
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!card || reduce) return;

            const max = 8; // max tilt in degrees
            document.addEventListener('mousemove', function (e) {
                const r = card.getBoundingClientRect();
                const x = (e.clientX - (r.left + r.width / 2)) / window.innerWidth;
                const y = (e.clientY - (r.top + r.height / 2)) / window.innerHeight;
                card.style.transform =
                    'rotateY(' + (x * max * 2) + 'deg) rotateX(' + (-y * max * 2) + 'deg)';
                card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
                card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
            });
            document.addEventListener('mouseleave', function () {
                card.style.transform = 'rotateX(0) rotateY(0)';
            });
        })();
    </script>
</body>

</html>
